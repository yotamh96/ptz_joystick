name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.14" }
      - run: pip install ruff==0.16.10 mypy==2.4.0 types-requests==2.33.0.20261006   # pinned: new releases add checks
      - run: ruff check .
      - run: mypy                        # settings in mypy.ini; checks every adapter against its Protocol

  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]         # README promises 3.11+ (tomllib); developed on 3.14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t .

  build:
    needs: [lint, test]
    runs-on: windows-latest
    permissions:
      contents: write                    # gh release create
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.14" }
      - run: pip install -r requirements.txt pyinstaller

      - name: Build exes
        run: |
          # A release exe carries its tag, so it can tell when a newer release exists. Other builds stay "dev".
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            "VERSION = `"$env:GITHUB_REF_NAME`"" | Out-File ptz_joystick\app\version.py -Encoding ascii
          }
          "import ptz_joystick.__main__" | Out-File launch.py -Encoding ascii   # __main__.py uses relative imports
          pyinstaller --onefile --name ptz_joystick launch.py
          # The same program started as --tray, built with no console window.
          "import sys; sys.argv.insert(1, '--tray'); import ptz_joystick.__main__" | Out-File launch_tray.py -Encoding ascii
          pyinstaller --onefile --windowed --name ptz_joystick_tray launch_tray.py

      - name: Sign exes
        env:
          SIGNING_PFX: ${{ secrets.SIGNING_PFX }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:SIGNING_PFX) {
            if ($env:GITHUB_REF_TYPE -eq "tag") { throw "SIGNING_PFX secret missing: releases must be signed" }
            "::warning::SIGNING_PFX secret not set, exe left unsigned"
            exit 0
          }
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            [Convert]::FromBase64String($env:SIGNING_PFX), $env:SIGNING_PFX_PASSWORD)
          foreach ($exe in "dist\ptz_joystick.exe", "dist\ptz_joystick_tray.exe") {
            Set-AuthenticodeSignature $exe -Certificate $cert -HashAlgorithm SHA256 `
              -TimestampServer http://timestamp.digicert.com | Out-Null
            # Status is UnknownError here (runner doesn't trust our self-signed root), so check the signer instead.
            if ((Get-AuthenticodeSignature $exe).SignerCertificate.Thumbprint -ne $cert.Thumbprint) {
              throw "$exe not signed"
            }
          }

      - name: Smoke test
        run: |
          # No PTZ_PASSWORD on the runner: the exe must get through every import and stop at the password check.
          $out = & dist\ptz_joystick.exe 2>&1 | Out-String
          if ($LASTEXITCODE -ne 1 -or $out -notmatch "Set the camera password first") {
            throw "unexpected exit $LASTEXITCODE`n$out"
          }
          # The settings template is written before the password check. cwd isn't dist\, so this proves it lands next to the exe.
          if (-not (Test-Path dist\ptz_joystick.toml)) { throw "exe did not create dist\ptz_joystick.toml" }
          $want = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev" }
          $version = (& dist\ptz_joystick.exe --version | Out-String).Trim()
          if ($version -ne $want) { throw "exe --version says '$version', expected '$want'" }
          exit 0

      - name: Smoke test (tray)
        run: |
          # No PTZ_PASSWORD: the tray exe must start, write the password check to the log next to it, and keep
          # running (red dot) until Quit. It has no console, so the log is the only thing to check.
          Remove-Item dist\ptz_joystick.log -ErrorAction SilentlyContinue
          Start-Process dist\ptz_joystick_tray.exe
          $log = ""
          foreach ($i in 1..30) {
            Start-Sleep 1
            $log = Get-Content dist\ptz_joystick.log -Raw -ErrorAction SilentlyContinue
            if ($log -match "Set the camera password first") { break }
          }
          Get-Process ptz_joystick_tray -ErrorAction SilentlyContinue | Stop-Process -Force   # a onefile exe is two processes
          if ($log -notmatch "Set the camera password first") { throw "tray exe did not log the password check:`n$log" }
          $want = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev" }
          if ($log -notmatch "ptz_joystick $([regex]::Escape($want)) \(tray\)") { throw "tray exe logged no '$want (tray)' line:`n$log" }

      - uses: actions/upload-artifact@v7
        with:
          name: ptz_joystick
          path: |
            dist/ptz_joystick.exe
            dist/ptz_joystick_tray.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist\ptz_joystick.exe dist\ptz_joystick_tray.exe --repo $env:GITHUB_REPOSITORY --generate-notes
