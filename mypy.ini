# Type checking. Run "mypy" from the repo folder; CI runs the same.
[mypy]
files = ptz_joystick, tests
python_version = 3.11
# winmm.py and winconsole.py use Windows-only ctypes APIs, and CI lint runs on Linux.
platform = win32
# Also check inside unannotated functions: app.main is where the real adapters meet the Protocols,
# and the tests are where the fakes do.
check_untyped_defs = True
